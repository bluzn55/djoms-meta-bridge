<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#140d09">
  <title>Outlaw Radio 5150 | Most-Liked Songs</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;--gap:clamp(1px,1.4vh,3px);--pad:clamp(2px,2vh,6px);--small:clamp(8px,min(4vw,8vh),13px);--control-height:clamp(14px,16vh,28px);--foot-height:clamp(9px,9vh,15px)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:transparent;color:#fbe5b0}
    .panel{position:relative;display:flex;flex-direction:column;gap:var(--gap);width:100%;height:100%;padding:var(--pad);text-align:center;background:transparent}
    .leader{display:flex;flex:1;flex-direction:column;gap:var(--gap);min-height:0}
    .divider{display:none}
    .eyebrow{flex:none;margin:0;color:#e5af64;font-size:var(--small);line-height:1.1;font-weight:900;white-space:nowrap}
    .heart{color:#e64842;text-shadow:0 0 6px #b02826;margin-right:3px}
    .title{display:flex;flex:1;align-items:center;justify-content:center;min-height:0;margin:0;overflow:hidden;font:900 clamp(12px,min(7.8vw,14vh),25px)/1.1 Georgia,serif;overflow-wrap:anywhere;color:#ffe5a5;text-shadow:0 1px 1px #080604}
    .title-text{display:-webkit-box;width:100%;overflow:hidden;-webkit-box-orient:vertical}
    .likes{flex:none;margin:0;color:#f5ba9e;font:900 var(--small)/1.1 Arial,sans-serif}
    .tie{display:block;flex:none;font-size:clamp(7px,min(3.5vw,7vh),11px);line-height:1.1;color:#e2c48e;margin:0}.tie[hidden]{display:none}
    details{flex:none;width:100%;border:0;border-radius:0;background:transparent;text-align:left}
    summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:3px;height:var(--control-height);padding:0 2px;font-size:var(--small);line-height:1.1;font-weight:900;color:#ffdf9f;white-space:nowrap}
    summary::-webkit-details-marker{display:none}
    summary:focus-visible{outline:2px solid #fff2c1;outline-offset:-2px}
    .counter{font-size:clamp(7px,min(3.6vw,7vh),12px);color:#f1ca88;white-space:nowrap}
    .chevron{display:inline-block;margin-left:3px;transition:transform .12s ease}
    .panel:has(details[open]) .leader{visibility:hidden}
    details[open]{position:absolute;inset:var(--pad);width:auto}
    details[open] .chevron{transform:rotate(180deg)}
    .list{position:absolute;top:var(--control-height);right:0;bottom:var(--foot-height);left:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:0 2px;border-top:0}
    .song{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(3px,2vw,7px);padding:clamp(3px,3vh,8px) 0;border-bottom:1px solid #644627;font-size:var(--small);line-height:1.2;font-weight:800}
    .song:last-child{border-bottom:0}
    .place{color:#ceab73}
    .songname{overflow-wrap:anywhere}
    .count{color:#f5a695;font-weight:900;white-space:nowrap}
    .empty{margin:3px 0;font-size:var(--small);line-height:1.25;color:#e0c99f}
    .foot{position:absolute;right:0;bottom:0;left:0;height:var(--foot-height);display:flex;align-items:center;justify-content:center;color:#bda373;font-size:clamp(6px,min(3vw,6vh),10px);line-height:1.1;padding:0 2px;border-top:0;white-space:nowrap}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <section class="panel" aria-label="Outlaw Radio 5150 most-liked songs" aria-live="off">
    <div class="leader">
      <p class="eyebrow"><span class="heart" aria-hidden="true">♥</span>#1 MOST-LIKED SONG</p>
      <h2 class="title" aria-live="polite"><span id="topTitle" class="title-text">Checking listener votes…</span></h2>
      <p id="likeCount" class="likes" aria-live="polite"></p>
      <span class="tie" id="tie" hidden></span>
    </div>
    <details id="ranking">
      <summary>
        <span>ALL SONG LIKES</span>
        <span class="counter"><span id="totalSongs">…</span><span class="chevron" aria-hidden="true">▾</span></span>
      </summary>
      <div class="list" id="songList" role="list">
        <p class="empty">Loading verified votes…</p>
      </div>
      <div class="foot">Live listener hearts · Lifetime totals</div>
    </details>
  </section>
  <script>
    (() => {
      // Fit the song to the space left by the heading, votes and ranking control.
      // Only exceptionally long titles are truncated; their full text stays available.
      const title=document.getElementById('topTitle');
      const box=title.parentElement;
      let pending=false;
      function fit(){
        pending=false;
        if(!box.clientWidth||!box.clientHeight)return;
        let size=parseFloat(getComputedStyle(box).fontSize);
        title.style.webkitLineClamp='unset';
        title.style.fontSize=size+'px';
        while(size>8&&(title.scrollHeight>box.clientHeight||title.scrollWidth>box.clientWidth)){
          size=Math.max(8,size-.5);
          title.style.fontSize=size+'px';
        }
        title.style.webkitLineClamp=String(Math.max(1,Math.floor(box.clientHeight/(size*1.1))));
        title.title=title.textContent;
      }
      function schedule(){if(!pending){pending=true;requestAnimationFrame(fit);}}
      new ResizeObserver(schedule).observe(box);
      new MutationObserver(schedule).observe(title,{childList:true,characterData:true,subtree:true});
      schedule();
    })();
  </script>
  <script>
    (() => {
      'use strict';
      const api='/api/meta/song-likes-public';
      const top=document.getElementById('topTitle');
      const count=document.getElementById('likeCount');
      const total=document.getElementById('totalSongs');
      const list=document.getElementById('songList');
      const tie=document.getElementById('tie');
      let previous='';
      function text(el,value){el.textContent=String(value);}
      function display(data){
        if(data?.status!=='reported'||!Array.isArray(data.songs)) throw Error('unverified');
        const ranked=data.songs.filter(s=>s&&typeof s.title==='string'&&Number.isSafeInteger(s.likes)&&s.likes>=1)
          .sort((a,b)=>b.likes-a.likes||a.title.localeCompare(b.title));
        const signature=JSON.stringify(ranked.map(s=>[s.title,s.likes]));
        if(signature===previous)return;
        previous=signature;
        list.replaceChildren();
        text(total,ranked.length+' SONG'+(ranked.length===1?'':'S'));
        if(!ranked.length){
          text(top,'No song likes yet');
          text(count,'Be the first to vote!');
          tie.hidden=true;
          const empty=document.createElement('p');empty.className='empty';
          text(empty,'Songs appear here after listeners tap LIKE THIS SONG.');
          list.appendChild(empty);
          return;
        }
        const first=ranked[0],leaders=ranked.filter(s=>s.likes===first.likes);
        text(top,first.title);
        text(count,'♥ '+first.likes+' '+(first.likes===1?'LIKE':'LIKES'));
        tie.hidden=leaders.length<2;
        if(leaders.length>=2)text(tie,leaders.length+' SONGS TIED FOR FIRST');
        let position=0,lastLikes=null;
        ranked.forEach((song,index)=>{
          if(song.likes!==lastLikes){position=index+1;lastLikes=song.likes;}
          const row=document.createElement('div');row.className='song';row.setAttribute('role','listitem');
          const place=document.createElement('span');place.className='place';text(place,'#'+position);
          const title=document.createElement('span');title.className='songname';text(title,song.title);
          const hearts=document.createElement('span');hearts.className='count';text(hearts,'♥ '+song.likes);
          row.append(place,title,hearts);
          list.appendChild(row);
        });
      }
      async function refresh(){
        try{
          const response=await fetch(api,{cache:'no-store',headers:{Accept:'application/json'}});
          if(!response.ok)throw Error('unavailable');
          display(await response.json());
        }catch(e){
          if(previous)return; // keep last confirmed ranking visible during outages
          text(top,'Votes unavailable');
          text(count,'Unable to read the live song ranking');
          text(total,'N/A');
          list.replaceChildren();
          const notice=document.createElement('p');notice.className='empty';
          text(notice,'The voting report could not be reached. Try again soon.');
          list.appendChild(notice);
        }
      }
      refresh();
      setInterval(refresh,45000);
    })();
  </script>
</body>
</html>
